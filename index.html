<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Trinity Country Band</title>

<style>
:root{
  --bg:#0b1015;
  --card:#131b24;
  --line:#243140;
  --text:#f4ecd8;
  --accent:#9f2f2f;
  --accent2:#d7c6a0;
  --footer-h:58px;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#0b1015;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
}

.wrap,
.section{
  background:#0b1015;
}

.wrap{
  max-width:560px;
  margin:0 auto;
  padding:22px 16px calc(40px + var(--footer-h));
}

.hero{
  text-align:center;
  margin-bottom:10px;
}

.logo{
  width:110px;
  margin:0 auto 12px;
  display:block;
}

h1{
  font-size:1.4rem;
  margin:6px 0 12px;
  line-height:1.1;
}

.sub{
  color:var(--accent2);
  font-size:.82rem;
  text-transform:uppercase;
  font-weight:700;
  letter-spacing:.04em;
}

.sub:last-of-type{
  margin-bottom:14px;
}

.btns{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.top-btn{
  height:56px;
  border-radius:14px;
  border:1px solid #334252;
  background:#1a2430;
  color:#fff;
  font-weight:800;
  font-size:1rem;
  cursor:pointer;
  transition:background .2s ease,border-color .2s ease,transform .12s ease,box-shadow .2s ease;
  box-shadow:0 0 0 rgba(0,0,0,0);
}

.top-btn.active{
  background:var(--accent);
  border-color:var(--accent);
  box-shadow:0 8px 20px rgba(159,47,47,.22);
}

.top-btn:active{
  transform:scale(.985);
}

.section{
  margin-top:10px;
  max-height:0;
  overflow:hidden;
  opacity:0;
  transform:translateY(-8px);
  transition:max-height .28s ease,opacity .22s ease,transform .22s ease;
}

.section.active{
  max-height:2000px;
  opacity:1;
  transform:translateY(0);
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 10px 24px rgba(0,0,0,.18);
}

.item + .item{
  border-top:1px solid rgba(255,255,255,.08);
}

.hub-link{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:14px;
  padding:18px 14px;
  text-decoration:none;
  color:var(--text);
  font-weight:800;
  font-size:1.05rem;
  transition:background .18s ease,transform .12s ease;
}

.hub-link:hover{
  background:rgba(255,255,255,.02);
}

.hub-link:active{
  transform:scale(.992);
}

.hub-link .label{
  display:block;
  line-height:1.25;
}

.hub-link .arrow{
  flex:0 0 auto;
  color:var(--accent2);
  font-size:1rem;
  opacity:.8;
  transform:translateX(0);
  transition:transform .18s ease,opacity .18s ease;
}

.hub-link:hover .arrow{
  transform:translateX(3px);
  opacity:1;
}

.footer{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  z-index:20;
  height:var(--footer-h);
  background:#0b1015;
  border-top:1px solid rgba(255,255,255,.08);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 14px;
}

.footer-inner{
  width:100%;
  max-width:560px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  font-size:.92rem;
  white-space:nowrap;
}

.footer a{
  color:var(--accent2);
  text-decoration:none;
  font-weight:700;
}

.footer span{
  color:#555;
}

@media (hover:none){
  .hub-link:hover{
    background:transparent;
  }
}

@media (max-width:380px){
  .footer-inner{
    font-size:.86rem;
    gap:8px;
  }
}
</style>
</head>

<body>

<div class="wrap">

<section class="hero">
  <img class="logo" src="https://i.imgur.com/GjeDHm8.png" alt="The Trinity Country Band">

  <div class="sub">Country Rock • Southern Rock</div>
  <div class="sub">Serra Gaúcha</div>

  <h1>The Trinity Country Band</h1>

  <div class="btns">
    <button class="top-btn" data-target="show">EXPERIÊNCIA</button>
    <button class="top-btn" data-target="midia">MATERIAL</button>
    <button class="top-btn" data-target="tecnico">PALCO</button>
    <button class="top-btn" data-target="contratacao">BOOKING</button>
  </div>
</section>

<section id="show" class="section">
  <div class="card" id="showLista"></div>
</section>

<section id="midia" class="section">
  <div class="card" id="midiaLista"></div>
</section>

<section id="tecnico" class="section">
  <div class="card" id="tecnicoLista"></div>
</section>

<section id="contratacao" class="section">
  <div class="card" id="contratacaoLista"></div>
</section>

</div>

<div class="footer">
  <div class="footer-inner">
    <a href="https://wa.me/5554999494951?text=Quero%20saber%20mais%20sobre%20o%20show%20da%20Trinity" target="_blank" rel="noopener">WhatsApp</a>
    <span>•</span>
    <a href="https://instagram.com/thetrinitycountryband" target="_blank" rel="noopener">Instagram</a>
    <span>•</span>
    <a href="mailto:thetrinitycountryband@gmail.com">E-mail</a>
  </div>
</div>

<script>
const HUB = {
  show: [
    { nome: "Teaser", link: "https://drive.google.com/file/d/1tKU-rYQbX5DctgjcOWQCFw2c88UWg2LT/view?usp=drivesdk" },
    { nome: "Sobre a Banda", link: "https://drive.google.com/file/d/1a7SfcJf3SRMI8Y1dL5-T-konWxjYya9f/preview" },
    { nome: "Canal do YouTube", link: "https://youtube.com/@thetrinitycountryband?si=5vrWVkYMwV_D-UYo" },
    { nome: "Repertório no Spotify", link: "https://open.spotify.com/playlist/6DXoWxqCUIVXHvR1lprHNA" }
  ],

  midia: [
    { nome: "Release", link: "https://drive.google.com/file/d/1s1NYUJCTUJoHJX0ZHokiRsxaU-cCSlvr/view?usp=drivesdk" },
    { nome: "Logo", link: "https://drive.google.com/file/d/15BjtknL05DZNKR_letXGPMxYLgZLUNXK/view?usp=drivesdk" },
    { nome: "Fotos oficiais", link: "https://drive.google.com/drive/folders/1jFKuKvDitR-P_kvFqZzqHmyGGcKzYty7" },
    { nome: "Vídeos completos", link: "https://drive.google.com/drive/folders/15ybuZhL8SEQ4NKHLJRdDUnpmHCWLJkYr" }
  ],

  tecnico: [
    { nome: "Mapa de palco", link: "https://drive.google.com/file/d/1ummE_1okQ6bwdAMTYCcR9Dqye9bUfRry/view?usp=drivesdk" },
    { nome: "Rider técnico", link: "#" },
    { nome: "Trilha de abertura", link: "https://drive.google.com/file/d/1XI9FoySpT7BydxlFHwS_g-rPMMWm5q41/view?usp=drivesdk" }
  ],

  contratacao: [
    { nome: "Rider de hospitalidade", link: "hospitalidade.html" },
    { nome: "Documentação para contratação", link: "https://drive.google.com/drive/folders/1OMqSmRIxMFNxsQuAYpnGHKTITlOuEuJr" }
  ]
};

function item(x){
  return `
    <div class="item">
      <a class="hub-link" href="${x.link}" target="_blank" rel="noopener">
        <span class="label">${x.nome}</span>
        <span class="arrow">→</span>
      </a>
    </div>
  `;
}

document.getElementById("showLista").innerHTML = HUB.show.map(item).join("");
document.getElementById("midiaLista").innerHTML = HUB.midia.map(item).join("");
document.getElementById("tecnicoLista").innerHTML = HUB.tecnico.map(item).join("");
document.getElementById("contratacaoLista").innerHTML = HUB.contratacao.map(item).join("");

const buttons = document.querySelectorAll(".top-btn");
const sections = document.querySelectorAll(".section");

let current = null;

buttons.forEach(btn => {
  btn.onclick = () => {
    const id = btn.dataset.target;

    if (current === id) {
      sections.forEach(s => s.classList.remove("active"));
      buttons.forEach(b => b.classList.remove("active"));
      current = null;
      return;
    }

    sections.forEach(s => s.classList.toggle("active", s.id === id));
    buttons.forEach(b => b.classList.toggle("active", b === btn));

    current = id;
  };
});
</script>

</body>
</html>
