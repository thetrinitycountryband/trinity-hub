<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Trinity Country Band</title>

<style>
:root{
  --bg:#0b1015;
  --card:#131b24;
  --line:#243140;
  --text:#f4ecd8;
  --accent:#9f2f2f;
  --accent2:#d7c6a0;
}

*{box-sizing:border-box}
html{scroll-behavior:smooth}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(180deg,#0b1015,#101923);
  color:var(--text);
}

.wrap{
  max-width:560px;
  margin:0 auto;
  padding:22px 16px 40px;
}

.hero{
  text-align:center;
  margin-bottom:10px;
}

.logo{
  width:110px;
  margin:0 auto 12px;
  display:block;
}

h1{
  font-size:1.4rem;
  margin:6px 0 12px;
}

.sub{
  color:var(--accent2);
  font-size:.82rem;
  text-transform:uppercase;
  font-weight:700;
}

.sub:last-of-type{
  margin-bottom:14px;
}

.btns{
  display:grid;
  gap:10px;
  margin-top:6px;
}

.top-btn{
  height:56px;
  border-radius:14px;
  border:1px solid #334252;
  background:#1a2430;
  color:#fff;
  font-weight:800;
  font-size:1rem;
  cursor:pointer;
  transition:.2s;
}

.top-btn.active{
  background:var(--accent);
  border-color:var(--accent);
}

.section{
  margin-top:10px;
  max-height:0;
  overflow:hidden;
  opacity:0;
  transition:.25s ease;
}

.section.active{
  max-height:2000px;
  opacity:1;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
}

.item + .item{
  border-top:1px solid rgba(255,255,255,.08);
}

.hub-link{
  display:block;
  padding:18px 10px;
  text-decoration:none;
  color:var(--text);
  font-weight:800;
  font-size:1.05rem;
}
</style>
</head>

<body>

<div class="wrap">

<section class="hero">
  <img id="logo" class="logo" src="https://i.imgur.com/GjeDHm8.png" alt="The Trinity Country Band">

  <div class="sub">Country Rock • Southern Rock</div>
  <div class="sub">Serra Gaúcha</div>

  <h1>The Trinity Country Band</h1>

  <div class="btns">
    <button class="top-btn" data-target="materiais">Materiais</button>
    <button class="top-btn" data-target="restrito">Sob liberação</button>
    <button class="top-btn" data-target="contato">Contato</button>
  </div>
</section>

<section id="materiais" class="section">
  <div class="card" id="publico"></div>
</section>

<section id="restrito" class="section">
  <div class="card" id="restritoLista"></div>
</section>

<section id="contato" class="section">
  <div class="card" id="contatos"></div>
</section>

</div>

<script>
const HUB = {

publico:[
  {nome:"Teaser",link:"https://drive.google.com/file/d/1tKU-rYQbX5DctgjcOWQCFw2c88UWg2LT/view?usp=drivesdk"},  
  {nome:"Apresentação da banda",link:"https://drive.google.com/file/d/1a7SfcJf3SRMI8Y1dL5-T-konWxjYya9f/preview"},     {nome:"Logo",link:"https://drive.google.com/file/d/15BjtknL05DZNKR_letXGPMxYLgZLUNXK/view?usp=drivesdk"},
  {nome:"Fotos oficiais",link:"https://drive.google.com/drive/folders/1jFKuKvDitR-P_kvFqZzqHmyGGcKzYty7"},
  {nome:"Pasta com Vídeos",link:"https://drive.google.com/drive/folders/15ybuZhL8SEQ4NKHLJRdDUnpmHCWLJkYr"},
  {nome:"Canal do Youtube",link:"https://youtube.com/@thetrinitycountryband?si=5vrWVkYMwV_D-UYo"},
  {nome:"Repertório no Spotify",link:"https://open.spotify.com/playlist/6DXoWxqCUIVXHvR1lprHNA"},
  {nome:"Rider de Hospitalidade",link:"hospitalidade.html"}
],

restrito:[
  {nome:"Mapa de Palco",link:"https://drive.google.com/file/d/1ummE_1okQ6bwdAMTYCcR9Dqye9bUfRry/view?usp=drivesdk"},
  {nome:"Material técnico",link:"#"},
  {nome:"Trilha de Abertura",link:"https://drive.google.com/file/d/1XI9FoySpT7BydxlFHwS_g-rPMMWm5q41/view?usp=drivesdk"},
  {nome:"Contratos Públicos",link:"#"}
],

contato:[
  {nome:"WhatsApp",link:"https://wa.me/5554999494951?text=Quero%20saber%20mais%20sobre%20o%20show%20da%20Trinity"},
  {nome:"Instagram",link:"https://instagram.com/thetrinitycountryband"},
  {nome:"E-mail",link:"mailto:thetrinitycountryband@gmail.com"}
]
};

const $ = s => document.querySelector(s);
const $$ = s => document.querySelectorAll(s);

function item(x){
return `<div class="item">
<a class="hub-link" href="${x.link}" target="_blank" rel="noopener">${x.nome}</a>
</div>`;
}

$("#publico").innerHTML = HUB.publico.map(item).join("");
$("#restritoLista").innerHTML = HUB.restrito.map(item).join("");
$("#contatos").innerHTML = HUB.contato.map(item).join("");

const buttons = $$(".top-btn");
const sections = $$(".section");

let current = null;

buttons.forEach(btn=>{
btn.onclick = ()=>{
const id = btn.dataset.target;

if(current === id){
sections.forEach(s=>s.classList.remove("active"));
buttons.forEach(b=>b.classList.remove("active"));
current = null;
return;
}

sections.forEach(s=>s.classList.toggle("active", s.id===id));
buttons.forEach(b=>b.classList.toggle("active", b===btn));

current = id;

setTimeout(()=>{
document.getElementById(id).scrollIntoView({behavior:"smooth"});
},100);
};
});
</script>

</body>
</html>
